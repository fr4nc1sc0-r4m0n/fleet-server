commands_restrictions:
    backport:
        conditions:
            - or:
                - sender-permission>=write
                - sender=github-actions[bot]
defaults:
    actions:
        backport:
            assignees:
                - '{{ author }}'
            labels:
                - backport
            title: '[{{ destination_branch }}](backport #{{ number }}) {{ title }}'
pull_request_rules:
    - actions:
        backport:
            branches:
                - main
      conditions:
        - merged
        - label=forwardport-main
      name: forward-port patches to main branch
    - actions:
        comment:
            message: "This pull request is now in conflicts. Could you fix it @{{author}}? \U0001F64F\nTo fixup this pull request, you can check out it locally. See documentation: https://help.github.com/articles/checking-out-pull-requests-locally/\n```\ngit fetch upstream\ngit checkout -b {{head}} upstream/{{head}}\ngit merge upstream/{{base}}\ngit push upstream {{head}}\n```\n"
      conditions:
        - -merged
        - -closed
        - conflict
      name: ask to resolve conflict
    - actions:
        close:
            message: |
                This pull request has been automatically closed by Mergify.
                There are some other up-to-date pull requests.
      conditions:
        - -merged
        - -closed
        - conflict
        - author=github-actions[bot]
        - label=automation
      name: close automated pull requests with bump updates if any conflict
    - actions:
        backport:
            branches:
                - "7.17"
      conditions:
        - merged
        - base=main
        - label~=^(backport-v7.17.0|backport-7.17)$
      name: backport patches to 7.17 branch
    - actions:
        comment:
            message: "This pull request has not been merged yet. Could you please review and merge it @{{ assignee | join(', @') }}? \U0001F64F\n"
      conditions:
        - -merged
        - -closed
        - author=mergify[bot]
        - '#check-success>0'
        - schedule=Mon-Mon 06:00-10:00[Europe/Paris]
        - '#assignee>=1'
      name: notify the backport has not been merged yet
    - actions:
        queue:
            name: default
        review:
            message: Automatically approving mergify
            type: APPROVE
      conditions:
        - check-success=fleet-server/pr-merge
        - check-success=CLA
        - base~=^(7|8)\.
        - label=backport
        - author=mergify[bot]
      name: automatic merge for 7\. or 8\. branches when CI passes
    - actions:
        queue:
            name: default
        review:
            message: Automatically approving mergify
            type: APPROVE
      conditions:
        - check-success=fleet-server/pr-merge
        - label=automation
        - files~=^dev-tools/integration/.env$
      name: automatic merge when CI passes and the file dev-tools/integration/.env is modified.
    - actions:
        backport:
            branches:
                - "8.6"
      conditions:
        - merged
        - label=backport-v8.6.0
      name: backport patches to 8.6 branch
    - actions:
        backport:
            branches:
                - "8.7"
      conditions:
        - merged
        - label=backport-v8.7.0
      name: backport patches to 8.7 branch
